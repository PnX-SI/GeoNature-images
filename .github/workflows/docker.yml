name: Docker

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'Makefile'
      - 'make/**'
      - '.gitignore'
      - '.github/**'
  release:
    types: [published]
  workflow_dispatch:

env:
  # used for release runs; push and workflow_dispatch runs use the "sha-<commit>" tag
  GEONATURE_UPSTREAM_TAG: "2.17.5"
  # how long to wait for a dispatched GeoNature build, in minutes
  GEONATURE_BUILD_TIMEOUT: 45

jobs:
  upstream:
    # This job will looks at GeoNature submodule to identify which commit is referenced, in order to
    # use GeoNature base images built from this specific commit when building extra images.
    # We look at submodule url to determinate where the images should be looked up.
    # If base images are not found for this commit, a build is triggered, and we wait for its completion.
    name: Resolve GeoNature base image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The tag of GeoNature base images, based on referenced commit by GeoNature submodule.
      tag: ${{ steps.resolve.outputs.tag }}
      # The owner of the GeoNature base images, based on GeoNature submodule url.
      owner: ${{ steps.gn.outputs.owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read GeoNature remote from .gitmodules
        id: gn
        run: |
          url=$(git config -f .gitmodules --get submodule.GeoNature.url)
          case "$url" in
            *github.com*) ;;
            *) echo "::error::Unexpected GeoNature submodule URL: $url"; exit 1 ;;
          esac
          slug=${url#*github.com}
          slug=${slug#[:/]}
          slug=${slug%.git}
          # Docker image references require a lowercase registry path
          echo "owner=${slug%%/*}" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"
          echo "repo=${slug#*/}" >> "$GITHUB_OUTPUT"

      - name: Resolve GeoNature base image tag
        id: resolve
        run: |
          sha=$(git ls-tree HEAD GeoNature | awk '{print $3}')
          if [ "${{ github.event_name }}" != "release" ]; then
            tag="sha-$(git rev-parse --short=7 "$sha")"
          else
            tag="$GEONATURE_UPSTREAM_TAG"
          fi
          {
            echo "### GeoNature base image"
            echo
            echo "- referenced commit: \`$sha\`"
            echo "- tag: \`$tag\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check GeoNature base images
        id: check
        if: github.event_name != 'release'
        env:
          BACKEND_IMAGE: ghcr.io/${{ steps.gn.outputs.owner }}/geonature-backend:${{ steps.resolve.outputs.tag }}
          FRONTEND_IMAGE: ghcr.io/${{ steps.gn.outputs.owner }}/geonature-frontend:${{ steps.resolve.outputs.tag }}
        run: |
          if docker manifest inspect "$BACKEND_IMAGE" > /dev/null 2>&1 \
            && docker manifest inspect "$FRONTEND_IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger GeoNature build
        if: steps.check.outputs.exists == 'false'
        uses: actions/github-script@v9
        env:
          UPSTREAM_OWNER: ${{ steps.gn.outputs.owner }}
          UPSTREAM_REPO: ${{ steps.gn.outputs.repo }}
          UPSTREAM_SHA: ${{ steps.resolve.outputs.sha }}
        with:
          # GEONATURE_REPO_TOKEN should be a fine-grained token with write access to upstream repo content
          github-token: ${{ secrets.GEONATURE_REPO_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: process.env.UPSTREAM_OWNER,
              repo: process.env.UPSTREAM_REPO,
              event_type: 'build-docker',
              client_payload: { ref: process.env.UPSTREAM_SHA },
            });

      - name: Wait for GeoNature base images
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GEONATURE_REPO_TOKEN }}
          BACKEND_IMAGE: ghcr.io/${{ steps.gn.outputs.owner }}/geonature-backend:${{ steps.resolve.outputs.tag }}
          FRONTEND_IMAGE: ghcr.io/${{ steps.gn.outputs.owner }}/geonature-frontend:${{ steps.resolve.outputs.tag }}
          UPSTREAM_OWNER: ${{ steps.gn.outputs.owner }}
          UPSTREAM_REPO: ${{ steps.gn.outputs.repo }}
        run: |
          deadline=$(( $(date +%s) + GEONATURE_BUILD_TIMEOUT * 60 ))
          until docker manifest inspect "$BACKEND_IMAGE" > /dev/null 2>&1 \
            && docker manifest inspect "$FRONTEND_IMAGE" > /dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after ${GEONATURE_BUILD_TIMEOUT}min waiting for $BACKEND_IMAGE and $FRONTEND_IMAGE"
              gh run list --repo "$UPSTREAM_OWNER/$UPSTREAM_REPO" --workflow docker.yml --limit 5 || true
              exit 1
            fi
            sleep 30
          done

  backend:
    name: Build geonature backend docker image
    needs: upstream
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init ':(exclude)GeoNature'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/geonature-backend-extra

      - name: Build and export image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-backend
          target: prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GEONATURE_BACKEND_IMAGE=ghcr.io/${{ needs.upstream.outputs.owner }}/geonature-backend:${{ needs.upstream.outputs.tag }}

  frontend:
    name: Build geonature frontend docker image
    needs: upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Init submodules
        run: git submodule update --init ':(exclude)GeoNature'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/geonature-frontend-extra

      - name: Build and export image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-frontend
          target: prod
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GEONATURE_FRONTEND_IMAGE=ghcr.io/${{ needs.upstream.outputs.owner }}/geonature-frontend:${{ needs.upstream.outputs.tag }}
